name: ci

on: [push, pull_request]

jobs:
  ruby-versions:
    if: ${{ startsWith(github.repository, 'ruby/') || github.event_name != 'schedule' }}
    uses: ruby/actions/.github/workflows/ruby_versions.yml@master
    with:
      engine: cruby
      min_version: 3.2

  test:
    needs: ruby-versions
    name: build (${{ matrix.ruby }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        ruby: [ '${{ needs.ruby-versions.outputs.latest }}' ]
        os: [ ubuntu ]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby ${{ matrix.ruby }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
    - name: Set up Bundler
      run: bundle install
    - name: Run test
      run: bundle exec rake
    - id: build
      run: |
        rake build:sha512
        cat pkg/SHA512
        gem=${GITHUB_REPOSITORY#*/}
        echo "pkg=$gem-${RUNNING_OS%-*}" >> $GITHUB_OUTPUT
      env:
        RUNNING_OS: ${{matrix.os}}
      if: ${{matrix.ruby == needs.ruby-versions.outputs.latest}}
      shell: bash
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        path: pkg/*
        name: ${{steps.build.outputs.pkg}}
      if: steps.build.outputs.pkg
